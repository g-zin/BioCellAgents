services:
  # Streamlit Web Application (Clinical Dark Precision UI)
  biocell-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biocell-app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./results:/app/results
    environment:
      - BIOMED_LOG_LEVEL=INFO
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Training service (optional, for GPU batch training jobs)
  biocell-trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biocell-trainer
    command: ["python", "-m", "src.models.train", "--train_fold", "1,2", "--val_fold", "3"]
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./results:/app/results
    environment:
      - BIOMED_LOG_LEVEL=DEBUG
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: "no"
    profiles: ["training"]

  # Dual-Layer Evaluation & Benchmark service
  biocell-eval:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biocell-eval
    command: ["python", "scripts/run_evals.py", "--mode", "synthetic", "--output-dir", "results/evals", "--fail-on-error"]
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./reports:/app/reports
      - ./results:/app/results
    environment:
      - BIOMED_LOG_LEVEL=INFO
    restart: "no"
    profiles: ["eval"]

  # Ollama LLM service (for local agent-based synthesis)
  ollama:
    image: ollama/ollama:latest
    container_name: biocell-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    profiles: ["agent"]

volumes:
  ollama_data:
    driver: local
