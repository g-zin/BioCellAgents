# ── BIOCELL GENUINELY AGENTIC 3-TASK PIPELINE ─────────────────────────────────
# Quantitative inference & table construction happen deterministically in Python
# (src/pipeline.py + src/reporting.py) BEFORE crew kickoff.

literature_research_task:
  description: >
    Review the pre-computed pathology profile below (organ origin, TME phenotype,
    cellular composition, spatial topology, and any pre-retrieved literature_evidence):

    PRE-COMPUTED RESULTS:
    {precomputed_results}

    YOUR MISSION:
    1. Inspect `organ.predicted_organ`, `spatial.tme_phenotype`, `cells.class_counts`,
       and `literature_evidence.results`.
    2. If `literature_evidence.results` contains fewer than 3 directly relevant peer-reviewed
       papers with valid PMIDs, actively call the `Literature Evidence Search` tool to
       search PubMed and Europe PMC. Start with a targeted query combining the organ +
       TME phenotype + spatial topology; if that returns <3 hits, adaptively broaden the
       query (e.g., organ + tumor microenvironment + immune infiltration or pathology AI calibration).
    3. Curate and rank the 3-5 most relevant verified papers covering:
       - TME phenotype & immune infiltration in the predicted organ
       - Spatial proximity graph / cell-cell topology in histopathology
       - Confidence calibration / temperature scaling in computational pathology
    4. NEVER fabricate any PMID, title, author, or journal. If external search returns
       no results, state clearly that no indexed literature was retrieved.
  expected_output: >
    A structured curated list of 3-5 verified peer-reviewed papers (or an explicit
    no-literature notice if none exist), where each paper includes:
    - Exact Vancouver-style citation with verified PMID (Author(s). Title. Journal. Year. PMID: XXXXXXX.)
    - Key supporting finding extracted from the abstract
    - Relevance rating (High/Medium/Low) and target report section(s) (Sections 4, 6, 8, 10)
    - Explicit list of all verified PMIDs retrieved in this task.
  agent: literature_researcher

pathology_synthesis_task:
  description: >
    Synthesize the deterministically computed quantitative pathology results and the
    curated peer-reviewed literature from `literature_research_task` into a publication-grade
    11-section Computational Pathology Report (Research Use Only - RUO).

    PRE-COMPUTED RESULTS (contains exact metrics AND pre-rendered `deterministic_tables_markdown`):
    {precomputed_results}

    MANDATORY RULES:
    - Quote ALL numeric values verbatim from `precomputed_results` (temperature tau + Fitted/Unfitted
      status, calibrated & raw confidence, exact total_cell_count, all 5 PanNuke class counts and
      percentages, pairwise interaction counts, graph V/E/clustering/density, and distances in BOTH
      px and um at 0.25 um/px).
    - Reuse the exact Markdown tables from `deterministic_tables_markdown` in Sections 2, 3, 5, 6, 7, 8.
    - Report ONLY the 5 PanNuke cell classes (Neoplastic, Inflammatory, Connective, Dead, Epithelial).
    - Ground biological claims with verified PMIDs ONLY:
      * Section 4 (TME phenotype & immune infiltration): cite >=2 verified papers
      * Section 6 (Spatial topology): cite >=1 verified paper
      * Section 8 (Confidence calibration): cite >=1 verified paper
      * Section 10 (Translational recommendations): cite >=1 verified paper per recommendation
      If no literature is available, write verbatim: "No indexed literature available for this claim."
    - Frame strictly as Research Use Only (RUO) analytical findings — never diagnose or prescribe.

    REQUIRED 11 SECTIONS (exact numbered Markdown headings):
    1. Document Metadata Header & Executive Analytical Summary
    2. Primary Organ Identification & Calibrated Confidence
    3. Cellular Microenvironment & 5-Class Breakdown
    4. Tumor Microenvironment (TME) Architecture & Immune Infiltration
    5. Pairwise Cell-Cell Interaction Matrix
    6. Spatial Proximity Graph & Topology Analysis
    7. Statistical Validity & Sample Quality Audit
    8. Confidence Calibration & Temperature Status
    9. Limitations, Artifacts & Domain Shift Risk
    10. Translational Research & Next Action Protocol
    11. References (Vancouver style with exact PMIDs, numbered sequentially)
  expected_output: >
    A complete, publication-ready 11-section Markdown computational pathology report (RUO)
    containing all verbatim quantitative tables, grounded biological synthesis, and
    sequentially numbered Vancouver references with verified PMIDs.
  agent: clinical_report_writer

fidelity_audit_task:
  description: >
    Audit the drafted 11-section pathology report from `pathology_synthesis_task` against
    the ground-truth quantitative payload below using the `Report Fidelity Verifier` tool.

    GROUND-TRUTH PRE-COMPUTED RESULTS:
    {precomputed_results}

    YOUR MISSION:
    1. Call the `Report Fidelity Verifier` tool passing:
       - `report_markdown`: the complete drafted report from `pathology_synthesis_task`
       - `precomputed_results_json`: the exact ground-truth JSON above
       - `allowed_pmids`: any additional verified PMIDs returned by `literature_research_task`
    2. Inspect the verifier's score (0-100), pass/fail breakdown, issues, and fix instructions.
    3. If ANY check fails (missing section, numeric drift, altered cell count, extra non-PanNuke
       cell class, malformed table, >4 decimal places, ungrounded/fabricated PMID, or diagnostic
       language), repair the report directly and re-run `Report Fidelity Verifier` to confirm
       the corrected report passes.
    4. Return ONLY the final verified 11-section Markdown report (clean Markdown ready to save
       directly to `report.md`).
  expected_output: >
    The final, programmatically verified 11-section Markdown computational pathology report
    passing all 6 scientific fidelity criteria (structure, verbatim numeric accuracy,
    5-class bounds, Markdown tables, verified Vancouver PMIDs, and RUO compliance).
  agent: fidelity_auditor