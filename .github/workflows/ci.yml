name: BioCellAgents CI

on:
  push:
    branches: [main, develop, "validate/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install project and linters
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Flake8
        run: |
          flake8 src/ scripts/ tests/ app.py biocell_app.py main.py --max-line-length=120 --extend-ignore=E203,W503
      - name: Black
        run: |
          black --check src/ scripts/ tests/ app.py biocell_app.py main.py
      - name: Isort
        run: |
          isort --check-only src/ scripts/ tests/ app.py biocell_app.py main.py
      - name: Mypy
        run: |
          mypy --no-incremental src/ scripts/

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run unit, integration & Streamlit AppTest suite
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=xml
        env:
          CUDA_VISIBLE_DEVICES: ""
      - name: Run offline pipeline verification
        run: |
          python scripts/verify_pipeline.py --offline --device cpu
        env:
          CUDA_VISIBLE_DEVICES: ""
      - name: Run Dual-Layer Synthetic Eval Gate
        run: |
          python scripts/run_evals.py --mode synthetic --device cpu --output-dir results/evals --fail-on-error
        env:
          CUDA_VISIBLE_DEVICES: ""
      - name: Upload coverage and eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-py${{ matrix.python-version }}
          path: |
            coverage.xml
            results/evals/

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/validate/')
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (CPU CI variant)
        run: |
          docker build \
            --build-arg TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu \
            -t biocell-agent:${{ github.sha }} .
      - name: Verify container imports and Layer 2 eval gate
        run: |
          docker run --rm biocell-agent:${{ github.sha }} \
            python -c "import src, biocell_app; from src.evals.runner import run_report_fidelity_suite; assert run_report_fidelity_suite()['passed']; print('Container OK')"
      - name: Docker image info
        run: |
          docker images biocell-agent
